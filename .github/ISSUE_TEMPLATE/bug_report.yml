name: 🐛 Bug Report
description: Create a report to help us improve
title: "[Bug] "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug Description
        Please describe the bug clearly and concisely.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      placeholder: A clear and concise description of what the bug is
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What actually happened
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "e.g., Chrome 120, Node 18, macOS"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      placeholder: |
        ```
        Paste relevant error logs here
        ```
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the problem
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low - Minor issue, workaround available
        - Medium - Feature partially broken
        - High - Feature completely broken
        - Critical - System down, no workaround
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      placeholder: Add any other context about the problem here
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        
        ## ✅ Checklist
        
        - [ ] I have searched for similar issues
        - [ ] I have provided steps to reproduce
        - [ ] I have included relevant error messages/logs
        - [ ] I am using the latest version
