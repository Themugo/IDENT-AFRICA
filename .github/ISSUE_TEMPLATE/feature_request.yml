name: ✨ Feature Request
description: Suggest an idea for this project
title: "[Feature] "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## ✨ Feature Description
        Please describe the feature you would like to see implemented.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Describe the problem this feature would solve
      placeholder: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed solution
      placeholder: How would you solve this problem?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions you've considered
      placeholder: What other approaches have you considered?
    validations:
      required: false

  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      description: List specific use cases for this feature
      placeholder: |
        - As a [type of user], I want [goal] so that [benefit]
    validations:
      required: false

  - type: textarea
    id: mockups
    attributes:
      label: Mockups/Wireframes
      description: If applicable, provide mockups or wireframes
      placeholder: |
        ```
        Attach or link to mockups/wireframes
        ```
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low - Niche use case, can wait
        - Medium - Would improve the product
        - High - Important for near-term roadmap
        - Critical - Blocking major feature/requirement
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      placeholder: Add any other context or screenshots about the feature request here
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        
        ## ✅ Checklist
        
        - [ ] I have searched for existing feature requests
        - [ ] I have checked if this feature is already in development
        - [ ] I have considered backwards compatibility
        - [ ] I am willing to help implement this feature
